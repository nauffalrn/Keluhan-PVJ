<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Keluhan Toilet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>
<body class="bg-light">

<div class="container mt-4">
  <div class="card shadow">
    <div class="card-body">
      <h5 class="mb-3">Form Keluhan Toilet</h5>

      <div class="mb-3">
        <label class="form-label">Lokasi Toilet</label>
        <input type="text" id="toilet" class="form-control" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Kategori</label>
        <select id="kategori" class="form-select">
          <option value="">-- Pilih Kategori --</option>
          <option value="kebersihan">Kebersihan</option>
          <option value="infrastruktur">Infrastruktur</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Keluhan</label>
        <textarea id="keluhan" class="form-control" rows="4"></textarea>
      </div>

      <button class="btn btn-primary w-100" onclick="submitKeluhan()">
        Kirim Keluhan
      </button>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const toilet = params.get('toilet');
  document.getElementById('toilet').value = toilet || 'Tidak diketahui';

  async function submitKeluhan() {
    const kategori = document.getElementById('kategori').value;
    const keluhan = document.getElementById('keluhan').value;

    if (!kategori || !keluhan) {
      alert('Lengkapi semua field!');
      return;
    }

    const res = await fetch('http://localhost:3000/api/keluhan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        toilet,
        kategori,
        keluhan
      })
    });

    const data = await res.json();
    alert(data.message);
  }
</script>

</body>
</html>
